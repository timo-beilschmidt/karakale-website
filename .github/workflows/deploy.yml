name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-gh-pages:
    name: build and publish gh-pages
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Optimize images
        run: npm run optimize:images
      
      - name: Generate static site
        run: npm run generate
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
      
      - name: Prepare GitHub Pages files
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi
          touch dist/.nojekyll
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          keep_files: false
          commit_message: Deploy static site from ${{ github.sha }}

  retrieve-project:
    name: check IONOS readiness
    needs: publish-gh-pages
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ fromJson(steps.project.outputs.info).deployment-enabled }}
      branch-id: ${{ fromJson(steps.project.outputs.info).branch-id }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: b5ba8e64-53bb-4248-8f1d-409206bedeb0
          action: retrieve-info

  build:
    name: build IONOS artifact from gh-pages
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/karakale-website-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  deploy:
    name: trigger IONOS deployment
    needs:
      - retrieve-project
      - build
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment(s)
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: b5ba8e64-53bb-4248-8f1d-409206bedeb0
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: dispatch-deployments

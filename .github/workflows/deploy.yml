name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-gh-pages:
    name: build and publish gh-pages
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Optimize images
        run: npm run optimize:images
      
      - name: Generate static site
        run: npm run generate
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
      
      - name: Prepare GitHub Pages files
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi
          touch dist/.nojekyll
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          keep_files: false
          commit_message: Deploy static site from ${{ github.sha }}

  retrieve-project:
    name: check IONOS readiness for gh-pages
    needs: publish-gh-pages
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ steps.project.outputs.deployment-enabled }}
      branch-id: ${{ steps.project.outputs.branch-id }}
      deployment-ids: ${{ steps.project.outputs.deployment-ids }}
    steps:
      - name: Fetch gh-pages project data
        id: project
        env:
          IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
          IONOS_SERVICE_HOST: api-eu.ionos.space
          IONOS_PROJECT_ID: b5ba8e64-53bb-4248-8f1d-409206bedeb0
          IONOS_BRANCH_NAME: gh-pages
        run: |
          set -euo pipefail

          branches_json="$(curl -fsS --get \
            --data-urlencode "name=${IONOS_BRANCH_NAME}" \
            -H "Authorization: API-Key ${IONOS_API_KEY}" \
            "https://${IONOS_SERVICE_HOST}/v4/accounts/me/projects/${IONOS_PROJECT_ID}/branches")"
          branch_id="$(jq -r --arg name "${IONOS_BRANCH_NAME}" '.values[]? | select(.name == $name) | .id' <<< "${branches_json}" | head -n 1)"

          if [ -z "${branch_id}" ]; then
            echo "::warning::IONOS branch '${IONOS_BRANCH_NAME}' was not found."
            echo "deployment-enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          deployments_json="$(curl -fsS \
            -H "Authorization: API-Key ${IONOS_API_KEY}" \
            "https://${IONOS_SERVICE_HOST}/v4/accounts/me/projects/${IONOS_PROJECT_ID}/branches/${branch_id}/deployments")"
          deployment_count="$(jq -r '.total // 0' <<< "${deployments_json}")"
          deployment_ids="$(jq -c '[.values[]?.id]' <<< "${deployments_json}")"

          if [ "${deployment_count}" -lt 1 ]; then
            echo "::warning::The IONOS deployment is disabled for branch '${IONOS_BRANCH_NAME}'."
            echo "deployment-enabled=false" >> "${GITHUB_OUTPUT}"
            echo "branch-id=${branch_id}" >> "${GITHUB_OUTPUT}"
            echo "deployment-ids=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "deployment-enabled=true" >> "${GITHUB_OUTPUT}"
          echo "branch-id=${branch_id}" >> "${GITHUB_OUTPUT}"
          echo "deployment-ids=${deployment_ids}" >> "${GITHUB_OUTPUT}"

  build:
    name: build IONOS artifact from gh-pages
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/karakale-website-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  deploy:
    name: trigger IONOS deployment
    needs:
      - retrieve-project
      - build
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch deployment(s)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IONOS_PROJECT_ID: b5ba8e64-53bb-4248-8f1d-409206bedeb0
          IONOS_BRANCH_ID: ${{ needs.retrieve-project.outputs.branch-id }}
          IONOS_DEPLOYMENT_IDS: ${{ needs.retrieve-project.outputs.deployment-ids }}
        run: |
          gh workflow run deploy-to-ionos.yaml \
            --ref main \
            --field "version=${GITHUB_SHA}" \
            --field "project-id=${IONOS_PROJECT_ID}" \
            --field "branch-id=${IONOS_BRANCH_ID}" \
            --field "deployment-ids=${IONOS_DEPLOYMENT_IDS}"

1 text-white">Unsere Leistungen</h1></div></div></div></div></div> <div class="brook-service-modern ptb--150 ptb-md--80 ptb-sm--60 bg_color--1"><div class="container"><div class="row"><div class="col-xl-4 col-lg-5"><div class="modern-service"><h3 class="heading heading-h3 line-height-1-42 wow move-up">Kfz Gutachten und Prüfbüro Karakale -<br> Ihr Kfz Sachverständiger in Bonn</h3></div></div> <div class="col-xl-7 offset-xl-1 col-lg-7 mt_md--30 mt_sm--30"><div class="modern-service wow move-up"><h5 class="heading heading-h5">Leistungen & Service</h5> <div class="bkseparator--20"></div> <h5 class="heading heading-h5 body-color line-height-1-62">Wenn Sie Wert auf objektive, kompetente, schnelle und fachmännische Urteile legen, sind Sie hier genau richtig.</h5> <div class="bkseparator--30"></div> <p class="bk_pra">Egal ob Pkw, Lkw, Oldtimer, Motorrad, Motorroller, Sonder-Kfz oder sonstiges Fahrzeug. Wir begutachten jedes Kfz. Auch die Schadenhöhe ist zur Erstellung des Gutachtens für unsere Kfz-Gutachter unerheblich.<br>
                    Die Abrechnung unserer Gutachten erfolgt direkt mit der Versicherung, eine Vorauszahlung ist nicht notwendig.<br>
                    Die Rechtsprechung besagt, es darf bis zu der Bagatellschadengrenze von ca. 750,- Euro kein Kfz-Gutachter eingeschaltet werden. Bei Schäden unterhalb dieser Bagatellschadengrenze erstellen wir einen Kostenvoranschlag. So lohnt sich auch schon bei einer Beule, einem Kratzer oder einer anderen geringfügigen Beschädigung an Ihrem Auto der Besuch in unserem Haus. Um den Rest kümmern wir uns.<br><br>
                    Falle der ungeklärten Schuldfrage nach einem Unfall mit Ihrem Kfz fertigen wir kostenlos eine Beweissicherung für Sie durch. Hierzu erstellen wir Lichtbilder von Ihrem Kfz und den unfallbedingten Beschädigungen, notieren uns sämtliche relevanten Daten zum Unfallgeschehen und speichern diese vorerst in unserem Rechnersystem ab.<br> <strong>Seit neustem bieten wir auch Hauptuntersuchungen und Eintragungen an.</strong></p></div></div></div></div></div> <div class="brook-icon-boxes-area bg_color--1 pb_lg--50"><div class="container-fluid p-0"><div class="row"><div class="col-lg-7 pl--350 plr_lg--30 plr_md--50 plr_sm--15"><div class="row mtn--50"><div class="col-sm-6 wow move-up mt--50"><div class="icon-box text-left no-border"><div class="inner"><div class="icon"><i class="ion-ios-search"></i></div> <div class="content"><h5 class="heading heading-h5">Unfall-Gutachten</h5> <p class="bk_pra">Wir begutachten für Sie sämtliche Fahrzeugklassen. Sowohl PKW, LKW, Motorrad als auch Wohnmobile sind Bestandteile unserer Expertise.</p></div></div></div></div><div class="col-sm-6 wow move-up mt--50"><div class="icon-box text-left no-border"><div class="inner"><div class="icon"><i class="ion-ios-information-outline"></i></div> <div class="content"><h5 class="heading heading-h5">Oldtimer-Gutachten</h5> <p class="bk_pra">Sie wollen ein H-Kennzeichen oder sind am Kauf oder Verkauf klassischer Fahrzeuge interessiert? Dann ist ein Oldtimer-Gutachten das Richtige für Sie!</p></div></div></div></div><div class="col-sm-6 wow move-up mt--50"><div class="icon-box text-left no-border"><div class="inner"><div class="icon"><img width="70" height="90" src="/img/icons/icon-hauptuntersuchung-orange.svg" alt="Hauptuntersuchung Plakette Icon"></div> <div class="content"><h5 class="heading heading-h5">Hauptuntersuchung</h5> <p class="bk_pra">Als Partner einer amtlich anerkannten Prüforganisation bieten wir Hauptuntersuchungen an.</p></div></div></div></div><div class="col-sm-6 wow m

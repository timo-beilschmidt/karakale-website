5cf5e>Kfz Gutachten Karakale<br data-v-38e5cf5e>- Ihr Prüfingenieur in Bonn</h1></div></div></div></div></div> <div class="brook-whatdo-area ptb--100 ptb-md--80 ptb-sm--60 bg_color--1"><div class="container"><div class="row"><div class="col-lg-10 offset-lg-2"><div class="bk-title--default text-left"><h5 class="heading heading-h5 theme-color">Was wir tun</h5> <div class="bkseparator--30"></div> <h3 class="heading heading-h3">Gutachten und Hauptuntersuchungen<br> für jedes Kfz</h3></div></div></div> <div class="row mt--40 mt_md--20 mt_sm--5"><div class="col-xl-2 col-lg-2"><div class="what-do mt--40 mt_md--5 mt_sm--5"><div class="basic-separator line-3"></div></div></div> <div class="col-xl-4 col-lg-5 col-md-6 col-sm-12"><div class="what-do mt--40"><div class="content"><h5 class="heading heading-h5 theme-color wow move-up">Kfz Gutachten Karakale</h5> <div class="bkseparator--20"></div> <p class="bk_pra wow move-up">Unser Unternehmen wurde 2002 von meinem Vater Ali Karakale, Karosseriebaumeister seit 1993 gegründet.<br><br>Ich, Ahmet Talha Karakale, bin in der Werkstatt meines Vaters aufgewachsen und habe somit mein Leben mit Fahrzeugen verbracht.<br><br>Fahrzeuge und Technik sind meine Leidenschaft.</p></div></div></div> <div class="col-xl-4 col-lg-5 col-md-6 col-sm-12 offset-xl-1"><div class="what-do mt--40"><div class="content"><h5 class="heading heading-h5 theme-color wow move-up">Über mich</h5> <div class="bkseparator--20"></div> <p class="bk_pra wow move-up">In meiner Studienzeit habe ich angefangen, das Kfz-Gutachtenwesen von Grund auf zu erlernen.<br>Dafür habe ich diverse Fortbildungsseminare besucht und mein praktisches Wissen in der Technik vertieft.<br>Nach meinem abgeschlossenen Maschinenbaustudium habe ich mich zum Prüfingenieur weitergebildet. Daraufhin sammelte ich drei Jahre lang Erfahrungen in einer der größten Prüforganisationen weltweit.<br>2022 habe ich das Familienunternehmen übernommen und weiter aufgebaut. Zusätzlich haben wir unsere eigene Prüfstelle in Bonn eröffnet.<br>Heute bieten wir in ganz NRW und Rheinlandpfalz Hauptuntersuchungen und Unfallgutachten an.<br>Mit einem kontinuierlich wachsenden Team und einem nachhaltigen sowie fundiertem Wissen sind wir für die Zukunft vorbereitet.</p></div></div></div></div></div></div> <div class="flexale-image bg_color--1"><div class="container"><div class="row"><div class="col-lg-12"><div class="brook-element-carousel flexable-arrow flexable-dots"><div class="swiper-container"><div class="swiper-wrapper"><div class="swiper-slide"><div class="flexale-image"><div class="thumb"><img src="/img/other/ZOE_cut.webp" alt="Renault ZOE als Firmenwagen mit Logo auf der linken Seite." width="800" height="600" loading="lazy"></div></div></div> <div class="swiper-slide"><div class="flexale-image"><div class="thumb"><img src="/img/logo/logo_karakale.svg" alt="Das Logo von Kfz Gutachten Karakale in Farbe." width="400" height="200" loading="lazy"></div></div></div></div></div></div></div></div></div></div> <div class="brook-testimonial-area bg_color--7 swiper-custom-arrow swiper-arrow-hover"><div class="row row--0 align-items-center"><div class="col-lg-3 col-xl-5 text-center ptb-md--80 ptb-sm--80"><div class="brook-section-title text-left title-max-width plr_sm--30 plr_md--40"><h3 class="heading heading-h3 text-white">Was man<br>über uns<br> sagt</h3></div></div> <div class="col-lg-9 col-xl-7"><div class="brook-element-carousel testimonial-space-right testimonial-color-variation"><div class="swiper-container"><div class="swiper-wrapper"><div class="swiper-slide"><div class="testimonial testimonial_style--1 hover-transparent space-large--topbottom bg-dark"><div class="content"><p class="bk_pra">Mein Auto kommt seit Jahren nur noch zu Herrn Karakale. Ich bin zufrieden mit ihm. Weil ich ein Stammkunde bin möchte ich auch nicht zuuu viele lobende Worte verlieren. Nur eins ist sicher. Ein sehr vertrauenswürdiger Mann</p> <div class="testimonial-info"><div class="post-thumbnail"><img s
